<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>주인 잃은 우편가방 — 중학교 3학년 한국사 방탈출</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet" />
  <style>
    :root {
      /* 한지 · 먹 · 쪽빛 · 인주 팔레트 */
      --bg-hanji: #f5efe0;
      --bg-hanji-deep: #ebe1c9;
      --bg-card: #fffdf7;
      --bg-card-sub: #f9f4e6;
      --ink: #1e2328;
      --ink-soft: #4e5660;
      --indigo: #1d3c63;
      --indigo-hover: #142b48;
      --indigo-tint: #e8eff7;
      --ochre: #8c5210;
      --ochre-bg: #fdf5e2;
      --ochre-border: #d9a75a;
      --vermilion: #b82020;
      --vermilion-tint: #fdeaea;
      --emerald: #0b6647;
      --emerald-tint: #e6f6ef;
      --border: #d4c7ae;
      --shadow: 0 6px 20px rgba(30, 35, 40, 0.08);
      --radius: 14px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-hanji: #1b1916;
        --bg-hanji-deep: #25221d;
        --bg-card: #26231e;
        --bg-card-sub: #302c25;
        --ink: #f2ece1;
        --ink-soft: #b8afa0;
        --indigo: #5b93d6;
        --indigo-hover: #76a8e3;
        --indigo-tint: #1f2e42;
        --ochre: #e2a44f;
        --ochre-bg: #332717;
        --ochre-border: #8c6229;
        --vermilion: #f26363;
        --vermilion-tint: #3b1e1e;
        --emerald: #4cc397;
        --emerald-tint: #18362b;
        --border: #474035;
        --shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100%;
      width: 100%;
      overflow-x: hidden;
      font-family: 'Gowun Dodum', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      font-size: 17px;
      line-height: 1.65;
      color: var(--ink);
      background-color: var(--bg-hanji);
      background-image:
        radial-gradient(rgba(160, 142, 110, 0.16) 1px, transparent 1px),
        linear-gradient(180deg, rgba(255,255,255,0.25) 0%, rgba(0,0,0,0.03) 100%);
      background-size: 20px 20px, 100% 100%;
    }

    .serif {
      font-family: 'Gowun Batang', Georgia, 'Batang', serif;
    }

    button, input, select, textarea {
      font-family: inherit;
      font-size: 1rem;
    }

    button {
      cursor: pointer;
      min-height: 46px;
      border-radius: 11px;
      border: 1.5px solid transparent;
      padding: 10px 18px;
      font-weight: 700;
      transition: transform 0.12s ease, background-color 0.18s ease, box-shadow 0.18s ease;
    }

    button:active:not(:disabled) {
      transform: scale(0.98);
    }

    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 3px solid var(--indigo);
      outline-offset: 2px;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* 상단 고정 HUD 바 */
    .hud-bar {
      position: sticky;
      top: 0;
      z-index: 40;
      background: var(--bg-card);
      border-bottom: 2px solid var(--indigo);
      box-shadow: 0 3px 12px rgba(0,0,0,0.06);
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .hud-left {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .hud-title {
      font-family: 'Gowun Batang', serif;
      font-weight: 700;
      font-size: 1.05rem;
      color: var(--indigo);
    }

    .hud-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.86rem;
      font-weight: 700;
      background: var(--bg-card-sub);
      border: 1px solid var(--border);
    }

    .hud-pill.timer-warn {
      background: var(--vermilion-tint);
      color: var(--vermilion);
      border-color: var(--vermilion);
      animation: pulseWarn 1.2s infinite;
    }

    @keyframes pulseWarn {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.72; }
    }

    .hud-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* 교사 화면 비밀 진입 버튼 (오른쪽 구석 44x44px) */
    .teacher-secret-zone {
      width: 44px;
      height: 44px;
      min-height: 44px;
      padding: 0;
      background: transparent;
      border: none;
      border-radius: 8px;
      opacity: 0.18;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink-soft);
      font-size: 0.75rem;
    }

    .teacher-secret-zone:hover {
      opacity: 0.45;
    }

    /* 메인 컨테이너 */
    .app-main {
      max-width: 860px;
      margin: 0 auto;
      padding: 20px 16px 80px;
    }

    .card {
      background: var(--bg-card);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 22px 20px;
      box-shadow: var(--shadow);
      margin-bottom: 18px;
    }

    .card-physical {
      background: var(--ochre-bg);
      border: 2px solid var(--ochre-border);
    }

    .card-web {
      background: var(--bg-card);
      border: 2px solid var(--indigo);
    }

    /* 버튼 스타일 */
    .btn-primary {
      background: var(--indigo);
      color: #fff;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--indigo-hover);
    }

    .btn-ochre {
      background: var(--ochre);
      color: #fff;
    }

    .btn-ochre:hover:not(:disabled) {
      filter: brightness(1.08);
    }

    .btn-vermilion {
      background: var(--vermilion);
      color: #fff;
    }

    .btn-outline {
      background: var(--bg-card);
      color: var(--ink);
      border-color: var(--border);
    }

    .btn-outline:hover:not(:disabled) {
      border-color: var(--indigo);
      color: var(--indigo);
    }

    /* 배지 */
    .tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 700;
    }

    .tag-web {
      background: var(--indigo-tint);
      color: var(--indigo);
    }

    .tag-phys {
      background: var(--ochre);
      color: #fff;
    }

    .tag-done {
      background: var(--emerald-tint);
      color: var(--emerald);
    }

    /* 1500iD 방향 자물쇠 강조 경고 배지 */
    .lock-warning-banner {
      background: var(--vermilion-tint);
      border: 2px solid var(--vermilion);
      color: var(--vermilion);
      border-radius: 10px;
      padding: 12px 14px;
      font-weight: 700;
      font-size: 0.95rem;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* 한지 세로 괄선 편지지 */
    .letter-paper {
      font-family: 'Gowun Batang', Georgia, serif;
      background-color: #fbf6e8;
      background-image: repeating-linear-gradient(
        to right,
        transparent,
        transparent 38px,
        rgba(139, 115, 85, 0.16) 38px,
        rgba(139, 115, 85, 0.16) 39px
      );
      color: #1f1c18;
      border: 1.5px solid #cbbba0;
      border-radius: 12px;
      padding: 20px 18px;
      line-height: 1.85;
      font-size: 1.05rem;
      box-shadow: inset 0 0 24px rgba(168, 144, 108, 0.15);
    }

    .sender-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px dashed #bfa988;
    }

    .sender-avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--indigo);
      background: #efe5cf;
      flex-shrink: 0;
    }

    /* 사료 인용 상자 */
    .source-box {
      background: var(--bg-card-sub);
      border-left: 4px solid var(--indigo);
      padding: 14px 16px;
      border-radius: 0 10px 10px 0;
      margin: 12px 0;
      font-size: 0.96rem;
    }

    /* 다이얼 자물쇠 UI */
    .dial-row {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 18px 0;
      flex-wrap: wrap;
    }

    .dial-unit {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: linear-gradient(180deg, #d7b97a 0%, #f5e5bd 50%, #c8a663 100%);
      border: 2px solid #7c5c24;
      border-radius: 12px;
      padding: 6px;
      width: 64px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.18);
    }

    .dial-unit button {
      width: 100%;
      min-height: 46px;
      padding: 0;
      background: rgba(30, 35, 40, 0.85);
      color: #fff;
      font-size: 1.1rem;
      border-radius: 8px;
    }

    .dial-val {
      font-family: 'Gowun Batang', serif;
      font-size: 1.7rem;
      font-weight: 700;
      color: #1c1915;
      padding: 8px 0;
      user-select: none;
    }

    /* 4인 역할 그리드 */
    .role-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin: 14px 0;
    }

    @media (max-width: 520px) {
      .role-grid {
        grid-template-columns: 1fr;
      }
    }

    .role-item {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--bg-card-sub);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
    }

    .role-item img {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
    }

    /* 자모 암호 원판 슬롯 */
    .cipher-slots {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      margin: 14px 0;
    }

    .cipher-slot {
      min-width: 54px;
      padding: 8px 10px;
      border-radius: 10px;
      border: 2px solid var(--border);
      background: var(--bg-card-sub);
      text-align: center;
      cursor: pointer;
    }

    .cipher-slot.active {
      border-color: var(--indigo);
      background: var(--indigo-tint);
      box-shadow: 0 0 0 3px rgba(29, 60, 99, 0.18);
    }

    /* 레이어드 스탬프 그리드 */
    .stamps-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin: 14px 0;
    }

    @media (max-width: 540px) {
      .stamps-grid {
        grid-template-columns: 1fr;
      }
    }

    .stamp-card {
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      background: var(--bg-card-sub);
      text-align: center;
    }

    /* 모달 오버레이 */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(15, 20, 26, 0.72);
      backdrop-filter: blur(3px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-box {
      background: var(--bg-card);
      border: 2px solid var(--indigo);
      border-radius: 16px;
      max-width: 680px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 22px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.35);
    }

    /* 인쇄 전용 뷰 (교사용 한성 약도 A3 / 장소 플랩 카드) */
    @media print {
      body * {
        visibility: hidden;
      }
      #printArea, #printArea * {
        visibility: visible;
      }
      #printArea {
        position: fixed;
        inset: 0;
        background: #fff !important;
        color: #000 !important;
        padding: 12mm;
      }
      .no-print {
        display: none !important;
      }
    }

    /* 토스트 메시지 */
    .toast-banner {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 80;
      background: #1e2328;
      color: #fff;
      padding: 12px 20px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.95rem;
      box-shadow: 0 8px 24px rgba(0,0,0,0.28);
      max-width: 92vw;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- 상단 고정 HUD 바 -->
  <header class="hud-bar no-print">
    <div class="hud-left">
      <span class="hud-title">📮 주인 잃은 우편가방</span>
      <span id="hudPartBadge" class="tag tag-web">1부 · 개혁을 바란 사람들</span>
      <span id="hudTeamBadge" class="hud-pill" style="display:none;">모둠: -</span>
    </div>

    <div class="hud-right">
      <span id="hudTimer" class="hud-pill" title="남은 시간">⏳ 40:00</span>
      <span id="hudStamps" class="hud-pill" title="남은 힌트 우표">
        <img src="img/hint_stamp.png" alt="" style="width:18px;height:22px;object-fit:contain;" onerror="this.style.display='none'" />
        <span>우표 5장</span>
      </span>
      <button id="secretAdminBtn" class="teacher-secret-zone" aria-label="교사 설정 열기" title="교사 설정 (3초 내 5회 터치)">⚙</button>
    </div>
  </header>

  <!-- 메인 게임 스테이지 -->
  <main id="appStage" class="app-main no-print"></main>

  <!-- 교사용 인쇄 전용 컨테이너 -->
  <div id="printArea" style="display:none;"></div>

  <!-- 모달 컨테이너 -->
  <div id="modalRoot"></div>

  <script>
    /* =========================================================================
     * 1. 핵심 유틸리티: 한지 안전 이미지, WebAudio 효과음, 한글 자모 분해 해시 비교
     * ========================================================================= */

    // 깨진 이미지 아이콘 없이 조용히 숨김 처리하는 안전 이미지 태그 생성기
    function safeImg(filename, alt = '', className = '', style = '') {
      if (!filename) return '';
      const src = filename.endsWith('.png') ? `img/${filename}` : `img/${filename}.png`;
      return `<img src="${src}" alt="${alt}" class="${className}" style="${style}" onerror="this.style.display='none'" />`;
    }

    // WebAudio 도장 '쾅' 효과음 및 알림음 (외부 오디오 파일 불필요)
    const SoundFX = {
      ctx: null,
      ensure() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume().catch(() => {});
        }
      },
      playStamp() {
        try {
          this.ensure();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(145, now);
          osc.frequency.exponentialRampToValueAtTime(42, now + 0.16);
          gain.gain.setValueAtTime(0.45, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.18);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.19);
        } catch (e) {}
      },
      playSuccess() {
        try {
          this.ensure();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          [523.25, 659.25].forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + idx * 0.09);
            gain.gain.setValueAtTime(0.18, now + idx * 0.09);
            gain.gain.exponentialRampToValueAtTime(0.005, now + idx * 0.09 + 0.22);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + idx * 0.09);
            osc.stop(now + idx * 0.09 + 0.24);
          });
        } catch (e) {}
      }
    };

    // 한글 음절 자모 분해 테이블
    const CHO = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
    const JUNG = ['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
    const JONG = ['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];

    function decomposeHangul(str) {
      let out = '';
      for (let i = 0; i < str.length; i++) {
        const code = str.charCodeAt(i);
        if (code >= 0xAC00 && code <= 0xD7A3) {
          const offset = code - 0xAC00;
          const choIdx = Math.floor(offset / 588);
          const jungIdx = Math.floor((offset % 588) / 28);
          const jongIdx = offset % 28;
          out += CHO[choIdx] + JUNG[jungIdx] + JONG[jongIdx];
        } else {
          out += str[i];
        }
      }
      return out;
    }

    function normalizeAnswer(raw) {
      if (raw === null || raw === undefined) return '';
      const cleaned = String(raw)
        .toLowerCase()
        .replace(/[\s·ㆍ.,!?'"「」『』()\[\]\-_/]/g, '');
      return decomposeHangul(cleaned);
    }

    // 소스에 평문 정답을 남기지 않기 위한 동기식 이중 해시 함수
    function hashAnswer(raw) {
      const norm = normalizeAnswer(raw);
      let h1 = 0x811c9dc5;
      let h2 = 5381;
      for (let i = 0; i < norm.length; i++) {
        const c = norm.charCodeAt(i);
        h1 ^= c;
        h1 = Math.imul(h1, 0x01000193);
        h2 = ((h2 << 5) + h2) ^ c;
      }
      return (h1 >>> 0).toString(16).padStart(8, '0') + '_' + (h2 >>> 0).toString(16).padStart(8, '0');
    }

    function verifyAnswer(userInput, expectedHashes) {
      const userHash = hashAnswer(userInput);
      const list = Array.isArray(expectedHashes) ? expectedHashes : [expectedHashes];
      return list.includes(userHash);
    }

    // 커스텀 토스트 안내 (alert 대체)
    let toastTimer = null;
    function showToast(msg) {
      let el = document.getElementById('globalToast');
      if (!el) {
        el = document.createElement('div');
        el.id = 'globalToast';
        el.className = 'toast-banner no-print';
        document.body.appendChild(el);
      }
      el.textContent = msg;
      el.style.display = 'block';
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        el.style.display = 'none';
      }, 3200);
    }

    /* =========================================================================
     * 2. 교사 설정 & 게임 진행 상태 관리 (localStorage + QR 파라미터 자동 수신)
     * ========================================================================= */
    const STORAGE_CONFIG_KEY = 'postbag_teacher_config_v2';
    const STORAGE_STATE_KEY = 'postbag_game_state_v2';

    const DEFAULT_CONFIG = {
      pin: '7319',
      part: 1, // 1: 1부(1876~1894), 2: 2부(1895~1910)
      boxCodeP1: '4712',
      boxCodeP2: '8063',
      targetPlaceP2: '환구단', // 독립문·경복궁·경운궁·환구단·종로·우정총국
      virtualLockMode: false,
      vLockDirP1: '→↓←↑←↓',
      vLockEngP1: 'EQUAL',
      vLockDirP2: '←↓→↓',
      vLockEngP2: 'RIGHT',
      gasWebAppUrl: '' // Google Apps Script 결과 수집 웹 앱 URL
    };

    const DEFAULT_GAME_STATE = {
      started: false,
      teamName: '',
      screen: 'start', // start | prologue | gate | hub | letter | meta | final | ending
      prologueIdx: 0,
      gateSolved: false,
      activeLetterId: null, // 'l1' | 'l2' | 'l3' | 'l4'
      letters: {
        l1: { step: 0, done: false },
        l2: { step: 0, done: false },
        l3: { step: 0, done: false },
        l4: { step: 0, done: false }
      },
      // 도장 4개 회전 상태 (0, 1, 2, 3)
      stampRotations: [0, 0, 0, 0],
      metaSolved: false,
      finalSolved: false,
      remainingSeconds: 40 * 60,
      paused: false,
      hintStamps: 5,
      freeSecondHintVoucher: 0,
      note22Shown: false,
      usedHints: {}, // { 'l1_0_1': true }
      resultSubmitted: false,
      studentReply: ''
    };

    let teacherConfig = { ...DEFAULT_CONFIG };
    let gameState = JSON.parse(JSON.stringify(DEFAULT_GAME_STATE));

    function loadStorage() {
      try {
        const savedCfg = localStorage.getItem(STORAGE_CONFIG_KEY);
        if (savedCfg) teacherConfig = { ...DEFAULT_CONFIG, ...JSON.parse(savedCfg) };
      } catch (e) {}

      // QR코드 URL 파라미터(?gas=..., ?part=...)가 있으면 자동 반영
      try {
        const params = new URLSearchParams(window.location.search);
        const gasParam = params.get('gas');
        const partParam = params.get('part');
        let updated = false;
        if (gasParam && gasParam.startsWith('https://')) {
          teacherConfig.gasWebAppUrl = gasParam.trim();
          updated = true;
        }
        if (partParam === '1' || partParam === '2') {
          teacherConfig.part = Number(partParam);
          updated = true;
        }
        if (updated) saveConfig();
      } catch (e) {}

      try {
        const savedState = localStorage.getItem(STORAGE_STATE_KEY);
        if (savedState) {
          const parsed = JSON.parse(savedState);
          gameState = {
            ...JSON.parse(JSON.stringify(DEFAULT_GAME_STATE)),
            ...parsed,
            letters: { ...DEFAULT_GAME_STATE.letters, ...(parsed.letters || {}) }
          };
        }
      } catch (e) {}
    }

    function saveConfig() {
      try {
        localStorage.setItem(STORAGE_CONFIG_KEY, JSON.stringify(teacherConfig));
      } catch (e) {}
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_STATE_KEY, JSON.stringify(gameState));
      } catch (e) {}
    }

    /* =========================================================================
     * 3. 40분 수업 타이머 및 22분 경과 '복동의 쪽지' 자동 이벤트
     * ========================================================================= */
    let timerInterval = null;

    function startTimerLoop() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (!gameState.started || gameState.paused || gameState.screen === 'ending') return;
        if (gameState.remainingSeconds > 0) {
          gameState.remainingSeconds -= 1;

          // 22분 경과 (남은 시간 18분 = 1080초 도달 시) 복동의 쪽지 1회 팝업
          if (gameState.remainingSeconds === 18 * 60 && !gameState.note22Shown) {
            gameState.note22Shown = true;
            gameState.freeSecondHintVoucher += 1;
            showBokdongNote22Modal();
          }

          if (gameState.remainingSeconds % 5 === 0) saveState();
          updateHud();
        }
      }, 1000);
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function updateHud() {
      const partBadge = document.getElementById('hudPartBadge');
      const teamBadge = document.getElementById('hudTeamBadge');
      const timerEl = document.getElementById('hudTimer');
      const stampsEl = document.getElementById('hudStamps');

      partBadge.textContent = teacherConfig.part === 1
        ? '1부 · 개혁을 바란 사람들'
        : '2부 · 나라를 지키려 한 사람들';

      if (gameState.started && gameState.teamName) {
        teamBadge.style.display = 'inline-flex';
        teamBadge.textContent = `모둠: ${gameState.teamName}`;
      } else {
        teamBadge.style.display = 'none';
      }

      timerEl.textContent = `${gameState.paused ? '⏸' : '⏳'} ${formatTime(gameState.remainingSeconds)}`;
      if (gameState.remainingSeconds <= 300 && gameState.started) {
        timerEl.classList.add('timer-warn');
      } else {
        timerEl.classList.remove('timer-warn');
      }

      const voucherTxt = gameState.freeSecondHintVoucher > 0 ? ` (+무료권 ${gameState.freeSecondHintVoucher})` : '';
      stampsEl.querySelector('span').textContent = `우표 ${gameState.hintStamps}장${voucherTxt}`;
    }

    function showBokdongNote22Modal() {
      const modalRoot = document.getElementById('modalRoot');
      const portrait = teacherConfig.part === 1 ? 'bokdong_1895_smile.png' : 'bokdong_1910_smile.png';
      modalRoot.innerHTML = `
        <div class="modal-backdrop">
          <div class="modal-box" style="border-color: var(--ochre);">
            <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;">
              ${safeImg(portrait, '복동', 'sender-avatar')}
              <div>
                <span class="tag tag-phys">긴급 전보 · 22분 경과</span>
                <h3 class="serif" style="font-size:1.25rem;margin-top:4px;">우체부 복동의 응원 쪽지</h3>
              </div>
            </div>
            <p style="margin-bottom:14px;">
              "시간이 절반 넘게 흘렀구려! 배달이 막히는 곳이 있다면 주저 말고 나에게 물어보게.
              특별히 <strong>두 번째 핵심 귀띔 무료권 1장</strong>을 넣어 두었으니 요긴하게 쓰시게나!"
            </p>
            <div style="text-align:right;">
              <button class="btn-primary" onclick="closeModal()">고맙소, 계속 배달하겠소!</button>
            </div>
          </div>
        </div>
      `;
    }

    /* =========================================================================
     * 4. 재사용 가능한 퍼즐 & 인터랙션 엔진 (2단계·3단계 콘텐츠에서 호출)
     * ========================================================================= */

    // (A) 24자모 암호 원판 SVG 렌더러
    const JAMO_24 = ['ㄱ','ㄴ','ㄷ','ㄹ','ㅁ','ㅂ','ㅅ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ','ㅏ','ㅑ','ㅓ','ㅕ','ㅗ','ㅛ','ㅜ','ㅠ','ㅡ','ㅣ'];

    function renderCipherDiskComponent({ cipherChars, keySchedule, containerId }) {
      // keySchedule: 배열 (예: [3,3,3,3,3,3] 또는 [1,8,9,4,1,8])
      let currentShift = 0;
      let selectedSlot = 0;

      const wrap = document.getElementById(containerId);
      if (!wrap) return;

      function draw() {
        const targetK = keySchedule[selectedSlot] ?? keySchedule[0] ?? 0;
        const cx = 160, cy = 160, rOuter = 142, rMid = 104, rInner = 66;
        let outerLabels = '';
        let innerLabels = '';
        let spokes = '';

        for (let i = 0; i < 24; i++) {
          const angleDeg = (i * 15) - 90;
          const angleRad = (angleDeg * Math.PI) / 180;
          const nextRad = (((i + 1) * 15 - 90) * Math.PI) / 180;
          const midRad = ((angleDeg + 7.5) * Math.PI) / 180;

          // 방사형 구분선
          const x1 = cx + rInner * Math.cos(angleRad);
          const y1 = cy + rInner * Math.sin(angleRad);
          const x2 = cx + rOuter * Math.cos(angleRad);
          const y2 = cy + rOuter * Math.sin(angleRad);
          spokes += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#8c7a5b" stroke-width="1" />`;

          // 바깥 고정 링 글자
          const ox = cx + ((rOuter + rMid) / 2) * Math.cos(midRad);
          const oy = cy + ((rOuter + rMid) / 2) * Math.sin(midRad);
          const isOuterMatch = JAMO_24[i] === cipherChars[selectedSlot];
          outerLabels += `
            <text x="${ox.toFixed(1)}" y="${oy.toFixed(1)}" text-anchor="middle" dominant-baseline="central"
              font-size="14" font-weight="700" fill="${isOuterMatch ? '#b82020' : '#1e2328'}">
              ${JAMO_24[i]}
            </text>
          `;

          // 안쪽 회전 링 글자: J[(i - currentShift) mod 24], 글자는 항상 똑바로 서 있게(회전 0도) 배치
          const innerIdx = (i - currentShift + 240) % 24;
          const ix = cx + ((rMid + rInner) / 2) * Math.cos(midRad);
          const iy = cy + ((rMid + rInner) / 2) * Math.sin(midRad);
          innerLabels += `
            <text x="${ix.toFixed(1)}" y="${iy.toFixed(1)}" text-anchor="middle" dominant-baseline="central"
              font-size="14" font-weight="700" fill="${isOuterMatch ? '#1d3c63' : '#4e5660'}">
              ${JAMO_24[innerIdx]}
            </text>
          `;
        }

        const currentOuterChar = cipherChars[selectedSlot];
        const outerIdx = JAMO_24.indexOf(currentOuterChar);
        const mappedInnerChar = outerIdx >= 0 ? JAMO_24[(outerIdx - currentShift + 240) % 24] : '?';

        wrap.innerHTML = `
          <div style="background:var(--bg-card-sub);border:1.5px solid var(--border);border-radius:12px;padding:14px;margin:12px 0;">
            <div style="text-align:center;font-size:0.92rem;font-weight:700;color:var(--indigo);margin-bottom:8px;">
              현재 <strong>[${selectedSlot + 1}번째 암호 글자: ${currentOuterChar}]</strong> 해독 중 → 안쪽 원판을 <strong>[${targetK}칸]</strong>으로 맞추시오
            </div>

            <div class="cipher-slots">
              ${cipherChars.map((ch, idx) => `
                <div class="cipher-slot ${idx === selectedSlot ? 'active' : ''}" data-slot="${idx}">
                  <div style="font-size:0.75rem;color:var(--ink-soft);">${idx + 1}번 (${keySchedule[idx]}칸)</div>
                  <div class="serif" style="font-size:1.25rem;font-weight:700;">${ch}</div>
                </div>
              `).join('')}
            </div>

            <div style="display:flex;flex-direction:column;align-items:center;gap:10px;">
              <svg viewBox="0 0 320 320" style="width:100%;max-width:300px;height:auto;background:#fbf5e6;border-radius:50%;box-shadow:0 4px 14px rgba(0,0,0,0.12);">
                <circle cx="${cx}" cy="${cy}" r="${rOuter}" fill="#f4ead2" stroke="#7c5c24" stroke-width="3" />
                <circle cx="${cx}" cy="${cy}" r="${rMid}" fill="#fffdf7" stroke="#7c5c24" stroke-width="2" />
                <circle cx="${cx}" cy="${cy}" r="${rInner}" fill="#e8eff7" stroke="#1d3c63" stroke-width="2" />
                ${spokes}
                ${outerLabels}
                ${innerLabels}
                <text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700" fill="#1d3c63">
                  ${currentShift}칸
                </text>
              </svg>

              <div style="display:flex;align-items:center;gap:12px;">
                <button type="button" class="btn-outline" id="${containerId}_prev">◀ 반시계 (-1)</button>
                <span style="font-weight:700;min-width:95px;text-align:center;">
                  바깥 <span style="color:var(--vermilion);">${currentOuterChar}</span> → 안쪽 <span style="color:var(--indigo);">${mappedInnerChar}</span>
                </span>
                <button type="button" class="btn-outline" id="${containerId}_next">시계 (+1) ▶</button>
              </div>
            </div>
          </div>
        `;

        wrap.querySelectorAll('.cipher-slot').forEach(el => {
          el.onclick = () => {
            selectedSlot = Number(el.dataset.slot);
            draw();
          };
        });
        document.getElementById(`${containerId}_prev`).onclick = () => {
          currentShift = (currentShift - 1 + 24) % 24;
          draw();
        };
        document.getElementById(`${containerId}_next`).onclick = () => {
          currentShift = (currentShift + 1) % 24;
          draw();
        };
      }

      draw();
    }

    // (B) 레이어드 스탬프 4겹 합성 SVG 렌더러 (1부 엽서 번호 / 2부 한성 약도 배달길+✕)
    function renderLayeredMetaSVG(part, rotations) {
      // 정답 회전: 보기 순서 [위(0), 오른쪽(1), 아래(2), 왼쪽(3)] 중 정답 위치가 p일 때 회전수는 (4 - p) % 4
      // 1부 정답 인덱스: ① 치외법권(p=2 → rot=2), ② 급진개화파(p=1 → rot=3), ③ 일본군축출(p=3 → rot=1), ④ 일본의내정간섭(p=2 → rot=2)
      // 2부 정답 인덱스: ① 만민공동회(p=1 → rot=3), ② 황제전제정치(p=2 → rot=2), ③ 국제법상불법(p=3 → rot=1), ④ 국권피탈(p=1 → rot=3)
      const targetRots = part === 1 ? [2, 3, 1, 2] : [3, 2, 1, 3];

      const PLACES = {
        '경복궁': { x: 190, y: 70 },
        '우정총국': { x: 265, y: 120 },
        '종로': { x: 240, y: 140 },
        '독립문': { x: 95, y: 130 },
        '경운궁': { x: 175, y: 190 },
        '환구단': { x: 215, y: 205 }
      };

      // 4개 층에 대한 가로 줄무늬 clipPath 생성 (두께 3.5, 간격 14, i번째 줄)
      let clipDefs = '';
      for (let layer = 0; layer < 4; layer++) {
        let rects = '';
        for (let y = layer * 3.5; y < 300; y += 14) {
          rects += `<rect x="0" y="${y}" width="400" height="3.6" />`;
        }
        clipDefs += `<clipPath id="stripeClip_${layer}">${rects}</clipPath>`;
      }

      // 숨길 그래픽 요소 생성
      let secretGraphic = '';
      if (part === 1) {
        const code = teacherConfig.boxCodeP1 || '4712';
        secretGraphic = `
          <rect x="95" y="95" width="210" height="110" rx="14" fill="none" stroke="#b82020" stroke-width="4" stroke-dasharray="8 5" />
          <text x="200" y="166" text-anchor="middle" font-family="'Gowun Batang', serif" font-size="68" font-weight="700" letter-spacing="10" fill="#b82020">
            ${code}
          </text>
        `;
      } else {
        const dest = PLACES[teacherConfig.targetPlaceP2] || PLACES['환구단'];
        // 출발점: 한성 우체사 (종로 부근 248, 132)
        secretGraphic = `
          <path d="M 248 132 Q ${(248 + dest.x) / 2} ${(132 + dest.y) / 2 - 25} ${dest.x} ${dest.y}"
            fill="none" stroke="#b82020" stroke-width="5" stroke-dasharray="10 6" stroke-linecap="round" />
          <g transform="translate(${dest.x}, ${dest.y})">
            <circle cx="0" cy="0" r="22" fill="rgba(184,32,32,0.14)" stroke="#b82020" stroke-width="3" />
            <line x1="-13" y1="-13" x2="13" y2="13" stroke="#b82020" stroke-width="6" stroke-linecap="round" />
            <line x1="13" y1="-13" x2="-13" y2="13" stroke="#b82020" stroke-width="6" stroke-linecap="round" />
          </g>
        `;
      }

      let layersSvg = '';
      for (let i = 0; i < 4; i++) {
        const diffDeg = ((rotations[i] - targetRots[i] + 4) % 4) * 90;
        layersSvg += `
          <g clip-path="url(#stripeClip_${i})">
            <g transform="rotate(${diffDeg} 200 150)">
              ${secretGraphic}
            </g>
          </g>
        `;
      }

      // 2부일 경우 한성 성곽 및 장소 6곳 기본 레이어
      let baseMapSvg = '';
      if (part === 2) {
        const placeDots = Object.entries(PLACES).map(([name, pt]) => `
          <circle cx="${pt.x}" cy="${pt.y}" r="5" fill="#1d3c63" />
          <text x="${pt.x}" y="${pt.y - 9}" text-anchor="middle" font-size="12" font-weight="700" fill="#1e2328">${name}</text>
        `).join('');
        baseMapSvg = `
          <polygon points="140,42 265,48 325,115 305,225 185,252 125,195 120,105"
            fill="rgba(212,199,174,0.22)" stroke="#6b5c43" stroke-width="3" stroke-dasharray="6 3" />
          <line x1="120" y1="135" x2="315" y2="142" stroke="#9e8b6c" stroke-width="4" />
          <line x1="190" y1="70" x2="185" y2="235" stroke="#9e8b6c" stroke-width="3.5" />
          <circle cx="248" cy="132" r="4" fill="#8c5210" />
          <text x="275" y="136" font-size="10" font-weight="700" fill="#8c5210">한성우체사</text>
          ${placeDots}
        `;
      }

      const allAligned = rotations.every((r, idx) => r === targetRots[idx]);

      return {
        allAligned,
        svg: `
          <svg viewBox="0 0 400 300" style="width:100%;max-width:480px;height:auto;border-radius:12px;border:3px solid ${allAligned ? 'var(--emerald)' : 'var(--border)'};background:#f9f3e3;box-shadow:var(--shadow);">
            <defs>${clipDefs}</defs>
            ${baseMapSvg}
            ${layersSvg}
          </svg>
        `
      };
    }

    /* =========================================================================
     * 5. Google Apps Script 결과 자동 전송 모듈
     * ========================================================================= */
    async function submitResultToTeacher() {
      const replyInput = document.getElementById('studentReplyInput');
      const replyText = replyInput ? replyInput.value.trim() : gameState.studentReply;
      if (!replyText) {
        showToast('복동에게 보내는 답장을 먼저 작성해 주세요!');
        return;
      }

      gameState.studentReply = replyText;
      saveState();

      if (!teacherConfig.gasWebAppUrl) {
        showToast('교사 화면에 Apps Script URL이 아직 설정되지 않았습니다. 학습지에 작성해 주세요!');
        return;
      }

      const btn = document.getElementById('btnSendResult');
      if (btn) {
        btn.disabled = true;
        btn.textContent = '⏳ 선생님께 전송 중...';
      }

      const elapsedSec = Math.max(0, 40 * 60 - gameState.remainingSeconds);
      const grade = gameState.hintStamps >= 5 ? '금' : gameState.hintStamps >= 3 ? '은' : '동';

      const payload = {
        part: teacherConfig.part === 1 ? '1부(1876~1894)' : '2부(1895~1910)',
        teamName: gameState.teamName || '미입력 모둠',
        elapsedTime: formatTime(elapsedSec),
        remainingStamps: `${gameState.hintStamps}장`,
        grade: `${grade}등급`,
        reply: replyText
      };

      try {
        await fetch(teacherConfig.gasWebAppUrl, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        gameState.resultSubmitted = true;
        saveState();
        SoundFX.playSuccess();
        showToast('✅ 선생님 스프레드시트로 배달 결과가 전송되었습니다!');
        renderApp();
      } catch (err) {
        showToast('❌ 전송 중 네트워크 오류가 발생했습니다. 다시 시도해 주세요.');
        if (btn) {
          btn.disabled = false;
          btn.textContent = '📮 선생님께 배달 결과 전송';
        }
      }
    }

    /* =========================================================================
     * 6. 교사 관리 화면 (비밀 터치 5회 + PIN 7319 + 인쇄 화면)
     * ========================================================================= */
    let secretTapTimes = [];
    document.getElementById('secretAdminBtn').addEventListener('click', () => {
      const now = Date.now();
      secretTapTimes = secretTapTimes.filter(t => now - t < 3000);
      secretTapTimes.push(now);
      if (secretTapTimes.length >= 5) {
        secretTapTimes = [];
        openTeacherPinModal();
      }
    });

    function openTeacherPinModal() {
      const modalRoot = document.getElementById('modalRoot');
      modalRoot.innerHTML = `
        <div class="modal-backdrop">
          <div class="modal-box" style="max-width:400px;">
            <h3 class="serif" style="font-size:1.25rem;color:var(--indigo);margin-bottom:8px;">🔐 교사 관리 화면 인증</h3>
            <p style="font-size:0.92rem;color:var(--ink-soft);margin-bottom:14px;">교사용 비밀번호 4자리를 입력하세요. (기본값: 7319)</p>
            <input type="password" id="teacherPinInput" maxlength="8" inputmode="numeric" placeholder="비밀번호 입력"
              style="width:100%;padding:12px;border-radius:10px;border:1.5px solid var(--border);margin-bottom:14px;font-size:1.1rem;" />
            <div style="display:flex;justify-content:flex-end;gap:8px;">
              <button class="btn-outline" onclick="closeModal()">취소</button>
              <button class="btn-primary" onclick="checkTeacherPin()">확인</button>
            </div>
          </div>
        </div>
      `;
      setTimeout(() => document.getElementById('teacherPinInput')?.focus(), 50);
    }

    function checkTeacherPin() {
      const val = document.getElementById('teacherPinInput')?.value || '';
      if (val === teacherConfig.pin) {
        openTeacherDashboard();
      } else {
        showToast('비밀번호가 일치하지 않습니다.');
      }
    }

    function openTeacherDashboard() {
      const places = ['독립문', '경복궁', '경운궁', '환구단', '종로', '우정총국'];
      const placeOptions = places.map(p =>
        `<option value="${p}" ${teacherConfig.targetPlaceP2 === p ? 'selected' : ''}>${p}</option>`
      ).join('');

      const shareUrl = teacherConfig.gasWebAppUrl

    function saveTeacherDashboard() {
      const newPart = Number(document.getElementById('cfgPart').value);
      const boxP1 = document.getElementById('cfgBoxP1').value.trim();
      const placeP2 = document.getElementById('cfgPlaceP2').value;
      const vMode = document.getElementById('cfgVirtualMode').checked;
      const gasUrl = document.getElementById('cfgGasUrl').value.trim();

      const partChanged = teacherConfig.part !== newPart;
      teacherConfig.part = newPart;
      if (/^\d{4}$/.test(boxP1)) teacherConfig.boxCodeP1 = boxP1;
      teacherConfig.targetPlaceP2 = placeP2;
      teacherConfig.virtualLockMode = vMode;
      teacherConfig.gasWebAppUrl = gasUrl;
      saveConfig();

      if (partChanged) {
        gameState = JSON.parse(JSON.stringify(DEFAULT_GAME_STATE));
        saveState();
      }

      closeModal();
      updateHud();
      renderApp();
      showToast('교사 설정이 저장되었습니다.');
    }

    function copyQrShareLink(url) {
      const ta = document.createElement('textarea');
      ta.value = url;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        showToast('QR코드용 자동연결 주소가 복사되었습니다!');
      } catch (e) {
        showToast(url);
      }
      document.body.removeChild(ta);
    }

    function grantStampForce(idx) {
      const keys = ['l1', 'l2', 'l3', 'l4'];
      gameState.letters[keys[idx]].done = true;
      gameState.letters[keys[idx]].step = 3;
      saveState();
      SoundFX.playStamp();
      showToast(`도장 ${['①','②','③','④'][idx]}이(가) 강제 지급되었습니다.`);
      renderApp();
    }

    function adjustStamps(delta) {
      gameState.hintStamps = Math.max(0, gameState.hintStamps + delta);
      saveState();
      updateHud();
      showToast(`힌트 우표: ${gameState.hintStamps}장`);
    }

    function adjustTime(sec) {
      gameState.remainingSeconds = Math.max(0, gameState.remainingSeconds + sec);
      saveState();
      updateHud();
      showToast(`남은 시간: ${formatTime(gameState.remainingSeconds)}`);
    }

    function togglePauseTimer() {
      gameState.paused = !gameState.paused;
      saveState();
      updateHud();
      openTeacherDashboard();
    }

    function changeTeacherPin() {
      const np = document.getElementById('cfgNewPin')?.value.trim();
      if (np && np.length >= 4) {
        teacherConfig.pin = np;
        saveConfig();
        showToast('교사 비밀번호가 변경되었습니다.');
      } else {
        showToast('4자리 이상 입력해 주세요.');
      }
    }

    let resetConfirmArmed = false;
    function confirmResetProgress() {
      const btn = document.getElementById('btnResetAll');
      if (!resetConfirmArmed) {
        resetConfirmArmed = true;
        btn.textContent = '정말 초기화할까요? 한 번 더 누르면 실행';

          resetConfirmArmed = false;
          if (btn) btn.textContent = '⚠️ 진행 상황 처음부터 초기화';
        }, 4000);
      } else {
        resetConfirmArmed = false;
        gameState = JSON.parse(JSON.stringify(DEFAULT_GAME_STATE));
        saveState();
        closeModal();
        updateHud();
        renderApp();
        showToast('진행 상황이 처음부터 초기화되었습니다.');
