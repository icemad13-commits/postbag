              ${teacherConfig.part === 1 ? '주인 잃은 우편가방 : 개혁을 바란 사람들' : '주인 잃은 우편가방 : 나라를 지키려 한 사람들'}
            </h1>
            <p style="color:var(--ink-soft);max-width:580px;margin:0 auto 16px;">
              우정총국 전시실의 낡은 우편가방이 열리며 시간이 거꾸로 흐릅니다.<br/>
              가짝과 나짝이 힘을 모아 주인 잃은 편지 4통을 배달하고 기록 상자를 여십시오.
            </p>

            <div style="max-width:340px;margin:0 auto 18px;">
              ${safeImg('bag_locked.png', '잠긴 우편가방', '', 'width:180px;height:180px;object-fit:contain;margin:0 auto;')}
            </div>

            <div style="text-align:left;margin-bottom:18px;">
              <h2 class="serif" style="font-size:1.1rem;color:var(--indigo);margin-bottom:8px;">🤝 모둠 내 4인 역할 분담 (가짝 · 나짝 동시 진행)</h2>
              <div class="role-grid">
                <div class="role-item">
                  ${safeImg('role_recorder.png', '기록관')}
                  <div>
                    <strong style="color:var(--indigo);">가짝 ① 기록관 (편지 ①②)</strong>
                    <div style="font-size:0.86rem;color:var(--ink-soft);">『역사②』 교과서 및 사료 조항 대조</div>
                  </div>
                </div>
                <div class="role-item">
                  ${safeImg('role_navigator.png', '지도관')}
                  <div>
                    <strong style="color:var(--indigo);">가짝 ② 지도관 (편지 ①②)</strong>
                    <div style="font-size:0.86rem;color:var(--ink-soft);">격자 지도 경로 작도 · 1500iD 방향 자물쇠</div>
                  </div>
                </div>
                <div class="role-item">
                  ${safeImg('role_cipher.png', '암호관')}
                  <div>
                    <strong style="color:var(--ochre);">나짝 ③ 암호관 (편지 ③④)</strong>
                    <div style="font-size:0.86rem;color:var(--ink-soft);">UV 라이트 펜 전담 · 자모 암호 원판 해독</div>
                  </div>
                </div>
                <div class="role-item">
                  ${safeImg('role_detective.png', '수사관')}
                  <div>
                    <strong style="color:var(--ochre);">나짝 ④ 수사관 (편지 ③④)</strong>
                    <div style="font-size:0.86rem;color:var(--ink-soft);">5글자 영어 자물쇠 · 교실 코르크 보드 탐색</div>
                  </div>
                </div>
              </div>
            </div>

            <div style="max-width:420px;margin:0 auto;">
              <label for="teamNameInput" style="display:block;font-weight:700;margin-bottom:6px;">모둠 이름을 입력하고 배달을 시작하시오</label>
              <input type="text" id="teamNameInput" placeholder="예: 3반 4모둠" value="${gameState.teamName}"
                style="width:100%;padding:12px 14px;border-radius:10px;border:2px solid var(--indigo);text-align:center;font-size:1.1rem;margin-bottom:12px;" />
              <button class="btn-primary" style="width:100%;font-size:1.1rem;" onclick="handleStartGame()">
                📮 우편가방 열기 (40분 타이머 시작)
              </button>
            </div>
          </div>
        `;
        return;
      }

      renderScenarioScreen(stage, currentScenario);
    }

    function handleStartGame() {
      const name = document.getElementById('teamNameInput')?.value.trim();
      if (!name) {
        showToast('모둠 이름을 입력해 주세요!');
        return;
      }
      SoundFX.ensure();
      gameState.started = true;
      gameState.teamName = name;
      gameState.screen = 'prologue';
      gameState.prologueIdx = 0;
      saveState();
      updateHud();
      renderApp();
    }

    function renderScenarioScreen(stage, sc) {
      if (gameState.screen === 'prologue') {
        const slides = sc.prologue;
        const idx = Math.min(gameState.prologueIdx, slides.length - 1);
        const slide = slides[idx];
        stage.innerHTML = `
          <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
              <span class="tag tag-web">프롤로그 ${idx + 1} / ${slides.length}</span>
              <span style="font-size:0.88rem;color:var(--ink-soft);">${slide.speaker}</span>
            </div>
            ${slide.bg ? `<div style="margin-bottom:14px;text-align:center;">${safeImg(slide.bg, slide.speaker, '', 'width:100%;max-height:290px;object-fit:cover;border-radius:12px;border:1px solid var(--border);')}</div>` : ''}
            <div style="display:flex;align-items:flex-start;gap:14px;background:var(--bg-card-sub);padding:16px;border-radius:12px;border:1px solid var(--border);">
              ${slide.char ? safeImg(slide.char, '우체부 복동', '', 'width:84px;height:105px;object-fit:contain;flex-shrink:0;') : ''}
              <p class="serif" style="white-space:pre-line;font-size:1.05rem;">${slide.text}</p>
            </div>
            <div style="display:flex;justify-content:space-between;margin-top:16px;gap:10px;">
              ${idx > 0 ? `<button class="btn-outline" onclick="movePrologue(-1)">◀ 이전</button>` : `<div></div>`}
              <button class="btn-primary" onclick="movePrologue(1)">
                ${idx < slides.length - 1 ? '다음 장면 ▶' : '🔐 가방 자물쇠 관문으로 ▶'}
              </button>
            </div>
          </div>
        `;
        return;
      }

      if (gameState.screen === 'gate') {
        const g = sc.gate;
        const hintKey = `gate_${teacherConfig.part}`;
        const hintShown = Boolean(gameState.usedHints[hintKey]);
        stage.innerHTML = `
          <div class="card card-web" style="text-align:center;">
            <span class="tag tag-web" style="margin-bottom:8px;">관문 · 우편가방 잠금 해제</span>
            <h2 class="serif" style="font-size:1.45rem;color:var(--indigo);margin-bottom:8px;">가방 버클의 4자리 자물쇠를 여시오</h2>
            <div style="margin:10px auto;">
              ${safeImg(gameState.gateSolved ? 'bag_open.png' : 'bag_locked.png', '우편가방', '', 'width:150px;height:150px;object-fit:contain;margin:0 auto;')}
            </div>
            <div class="source-box" style="text-align:left;max-width:540px;margin:0 auto 14px;">
              <strong>🔎 ${g.clue}</strong>
            </div>

            ${!gameState.gateSolved ? `
              <div class="dial-row">
                ${[0, 1, 2, 3].map(i => `
                  <div class="dial-unit">
                    <button type="button" onclick="spinGateDial(${i}, 1)" aria-label="${i + 1}번째 숫자 올리기">▲</button>
                    <div class="dial-val">${stepLocalState.dials[i] || 0}</div>
                    <button type="button" onclick="spinGateDial(${i}, -1)" aria-label="${i + 1}번째 숫자 내리기">▼</button>
                  </div>
                `).join('')}
              </div>

              ${stepLocalState.wrongMsg ? `
                <div style="background:var(--vermilion-tint);color:var(--vermilion);padding:10px 14px;border-radius:10px;font-weight:700;margin-bottom:12px;">
                  ⚠️ ${stepLocalState.wrongMsg}
                </div>
              ` : ''}

              <div style="display:flex;justify-content:center;gap:10px;flex-wrap:wrap;">
                <button class="btn-outline" onclick="unlockHint('${hintKey}', 0)">💡 복동에게 묻기 (무료 귀띔)</button>
                <button class="btn-primary" onclick="checkGateAnswer()">🔓 자물쇠 열기</button>
              </div>

              ${hintShown ? `
                <div style="margin-top:12px;background:var(--ochre-bg);border:1px solid var(--ochre-border);padding:10px 14px;border-radius:10px;color:var(--ochre);font-weight:700;">
                  💡 복동의 귀띔: ${g.hint1}
                </div>
              ` : ''}
            ` : `
              <div style="background:var(--emerald-tint);border:1.5px solid var(--emerald);color:var(--emerald);padding:14px;border-radius:12px;margin-top:12px;font-weight:700;">
                ✅ ${g.successText}
              </div>
              <button class="btn-primary" style="margin-top:14px;" onclick="goToHub()">📮 가방 속 편지 4통 보기 (허브) ▶</button>
            `}
          </div>
        `;
        return;
      }

      if (gameState.screen === 'hub') {
        const keys = ['l1', 'l2', 'l3', 'l4'];
        const doneCount = keys.filter(k => gameState.letters[k].done).length;
        const hubBg = teacherConfig.part === 1 ? 'bg_storage_1895.png' : 'bg_storage_1910.png';

        stage.innerHTML = `
          <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px;">
              <div>
                <h2 class="serif" style="font-size:1.4rem;color:var(--indigo);">📬 우편가방 배달 허브</h2>
                <p style="font-size:0.92rem;color:var(--ink-soft);">가짝(편지 ①②)과 나짝(편지 ③④)이 각자 맡은 편지를 동시에 열어 배달하시오.</p>
              </div>
              <span class="tag ${doneCount === 4 ? 'tag-done' : 'tag-web'}" style="font-size:0.95rem;padding:6px 12px;">
                배달 완료: ${doneCount} / 4통
              </span>
            </div>

            ${safeImg(hubBg, '우체사 창고', '', 'width:100%;max-height:190px;object-fit:cover;border-radius:12px;margin-bottom:14px;border:1px solid var(--border);')}

            <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(260px, 1fr));gap:12px;margin-bottom:18px;">
              ${keys.map(k => {
                const lt = sc.letters[k];
                const st = gameState.letters[k];
                const isGa = (k === 'l1' || k === 'l2');
                return `
                  <div style="border:2px solid ${st.done ? 'var(--emerald)' : (isGa ? 'var(--indigo)' : 'var(--ochre-border)')};border-radius:12px;padding:14px;background:var(--bg-card-sub);display:flex;flex-direction:column;justify-content:space-between;gap:10px;">
                    <div>
                      <div style="display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:6px;">
                        <span class="tag ${isGa ? 'tag-web' : 'tag-phys'}">${lt.pairLabel}</span>
                        <span class="tag ${st.done ? 'tag-done' : ''}" style="${st.done ? '' : 'background:var(--bg-card);border:1px solid var(--border);'}">
                          ${st.done ? '💮 배달 완료' : (st.step > 0 ? `읽는 중 ${st.step + 1}/3` : '봉인됨')}
                        </span>
                      </div>
                      <div style="display:flex;align-items:center;gap:10px;margin-top:8px;">
                        ${safeImg(st.done ? 'envelope_open.png' : 'envelope_sealed.png', '봉투', '', 'width:52px;height:40px;object-fit:contain;flex-shrink:0;')}
                        <div>
                          <h3 class="serif" style="font-size:1.08rem;">${lt.title}</h3>
                          <div style="font-size:0.85rem;color:var(--ink-soft);">발신인: ${lt.sender}</div>
                        </div>
                      </div>
                    </div>
                    <button class="${st.done ? 'btn-outline' : 'btn-primary'}" style="width:100%;" onclick="openLetter('${k}')">
                      ${st.done ? '배달 완료 기록 보기' : (st.step > 0 ? '이어서 배달하기 ▶' : '편지 봉인 열기 ▶')}
                    </button>
                  </div>
                `;
              }).join('')}
            </div>

            <div style="background:var(--vermilion-tint);border:2px solid var(--vermilion);border-radius:12px;padding:16px;text-align:center;">
              <strong style="color:var(--vermilion);display:block;font-size:1.05rem;margin-bottom:6px;">
                💮 도장 4개를 모두 모았거나, 다른 짝의 배달 확인 암호를 받았나요?
              </strong>
              <button class="btn-vermilion" style="width:100%;max-width:420px;font-size:1.05rem;" onclick="goToMeta()">
                레이어드 스탬프 (도장 겹치기) 화면으로 이동 ▶
              </button>
            </div>
          </div>
        `;
        return;
      }

      if (gameState.screen === 'letter') {
        renderLetterStage(stage, sc);
        return;
      }

      if (gameState.screen === 'meta') {
        renderMetaStage(stage, sc);
        return;
      }

      if (gameState.screen === 'final') {
        renderFinalStage(stage, sc);
        return;
      }

      if (gameState.screen === 'ending') {
        renderEndingStage(stage, sc);
      }
    }

    function movePrologue(delta) {
      const sc = teacherConfig.part === 1 ? SCENARIO_DATA.part1 : SCENARIO_DATA.part2;
      const next = gameState.prologueIdx + delta;
      if (next < 0) return;
      if (next >= sc.prologue.length) {
        gameState.screen = 'gate';
        resetStepLocalState();
      } else {
        gameState.prologueIdx = next;
      }
      saveState();
      renderApp();
    }

    function spinGateDial(idx, delta) {
      stepLocalState.dials[idx] = ((stepLocalState.dials[idx] || 0) + delta + 10) % 10;
      stepLocalState.wrongMsg = '';
      renderApp();
    }

    function checkGateAnswer() {
      const sc = teacherConfig.part === 1 ? SCENARIO_DATA.part1 : SCENARIO_DATA.part2;
      const attempt = stepLocalState.dials.slice(0, 4).join('');
      if (verifyAnswer(attempt, sc.gate.answerHashes)) {
        gameState.gateSolved = true;
        SoundFX.playSuccess();
        saveState();
        renderApp();
      } else {
        stepLocalState.wrongMsg = sc.gate.wrongFeedback;
        renderApp();
      }
    }

    function goToHub() {
      gameState.screen = 'hub';
      gameState.activeLetterId = null;
      saveState();
      renderApp();
    }

    function openLetter(id) {
      gameState.screen = 'letter';
      gameState.activeLetterId = id;
      resetStepLocalState();
      saveState();
      renderApp();
    }

    /* =========================================================================
     * 10. 편지별 3단계 퍼즐 스테이지 렌더러 & 핸들러
     * ========================================================================= */
    function renderLetterStage(stage, sc) {
      const id = gameState.activeLetterId || 'l1';
      const lt = sc.letters[id];
      const st = gameState.letters[id];
      const stepIdx = Math.min(st.step, 2);
      const step = lt.steps[stepIdx];
      const stepSolvedKey = `${id}_${stepIdx}_solved`;
      const isStepSolved = Boolean(gameState.usedHints[stepSolvedKey]) || st.done;

      const h1Key = `${id}_${stepIdx}_h1`;
      const h2Key = `${id}_${stepIdx}_h2`;
      const h1Open = Boolean(gameState.usedHints[h1Key]);
      const h2Open = Boolean(gameState.usedHints[h2Key]);

      let puzzleBodyHtml = '';

      if (step.type === 'matching') {
        puzzleBodyHtml = `
          <div class="source-box" style="white-space:pre-line;">${step.sourceQuote}</div>
          <div style="display:grid;gap:12px;margin:14px 0;">
            ${step.items.map((it, idx) => `
              <div style="background:var(--bg-card-sub);border:1px solid var(--border);border-radius:10px;padding:12px;">
                <p style="margin-bottom:8px;font-weight:700;">${idx + 1}. ${it.text}</p>
                <div style="display:flex;gap:8px;flex-wrap:wrap;">
                  ${step.choices.map(ch => {
                    const chosen = stepLocalState.matching[idx] === ch;
                    return `<button type="button" class="${chosen ? 'btn-primary' : 'btn-outline'}" style="min-width:64px;"
                      onclick="selectMatchChoice(${idx}, '${ch}')">${ch}</button>`;
                  }).join('')}
                </div>
              </div>
            `).join('')}
          </div>
          ${!isStepSolved ? `<button class="btn-primary" style="width:100%;" onclick="submitMatchingStep()">짝짓기 정답 확인</button>` : ''}
        `;
      } else if (step.type === 'physical_dir' || step.type === 'physical_eng' || step.type === 'physical_board') {
        const dirBanner = step.type === 'physical_dir' ? `
          <div class="lock-warning-banner">
            <span style="font-size:1.3rem;">⚠️</span>
            <span>[주의] 열기 전 고리를 두 번 꼭 눌러 초기화하시오! 방향은 끝까지 밀고 가운데로 복귀!</span>
          </div>
        ` : '';

        let virtualLockHtml = '';
        if (teacherConfig.virtualLockMode && step.type === 'physical_dir') {
          const entered = stepLocalState.orderedList.join('');
          virtualLockHtml = `
            <div style="background:var(--bg-card);border:2px solid var(--indigo);border-radius:12px;padding:14px;margin:12px 0;text-align:center;">
              <strong style="color:var(--indigo);display:block;margin-bottom:6px;">🔒 가상 방향 자물쇠 모드</strong>
              <div style="font-size:1.3rem;font-weight:700;letter-spacing:4px;min-height:36px;background:var(--bg-card-sub);border-radius:8px;padding:6px;margin-bottom:10px;">
                ${entered || '(고리 초기화 후 방향 입력)'}
              </div>
              <div style="display:flex;justify-content:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;">
                ${['↑', '↓', '←', '→'].map(arrow => `
                  <button type="button" class="btn-outline" style="font-size:1.3rem;min-width:56px;" onclick="pushVirtualDir('${arrow}')">${arrow}</button>
                `).join('')}
              </div>
              <div style="display:flex;justify-content:center;gap:8px;">
                <button type="button" class="btn-outline" onclick="resetVirtualDir()">고리 2번 누르기(초기화)</button>
                <button type="button" class="btn-primary" onclick="checkVirtualDirLock()">자물쇠 열기</button>
              </div>
            </div>
          `;
        } else if (teacherConfig.virtualLockMode && step.type === 'physical_eng') {
          const letters = stepLocalState.dials.slice(0, 5).map(n => String.fromCharCode(65 + ((n % 26 + 26) % 26)));
          virtualLockHtml = `
            <div style="background:var(--bg-card);border:2px solid var(--indigo);border-radius:12px;padding:14px;margin:12px 0;text-align:center;">
              <strong style="color:var(--indigo);display:block;margin-bottom:6px;">🔤 가상 5글자 영어 자물쇠 모드</strong>
              <div class="dial-row">
                ${[0, 1, 2, 3, 4].map(i => `
                  <div class="dial-unit">
                    <button type="button" onclick="spinEngDial(${i}, 1)">▲</button>
                    <div class="dial-val">${letters[i]}</div>
                    <button type="button" onclick="spinEngDial(${i}, -1)">▼</button>
                  </div>
                `).join('')}
              </div>
              <button type="button" class="btn-primary" onclick="checkVirtualEngLock()">영어 자물쇠 열기</button>
            </div>
          `;
        }

        puzzleBodyHtml = `
          ${dirBanner}
          <ol style="padding-left:20px;display:grid;gap:8px;margin:12px 0;font-weight:700;">
            ${step.tasks.map(t => `<li>${t}</li>`).join('')}
          </ol>
          ${virtualLockHtml}
          ${(!isStepSolved && !teacherConfig.virtualLockMode) || (!isStepSolved && step.type === 'physical_board') ? `
            <button class="btn-ochre" style="width:100%;margin-top:8px;" onclick="completePhysicalStep()">
              ✅ ${step.completeBtn}
            </button>
          ` : ''}
        `;
      } else if (step.type === 'text_input') {
        puzzleBodyHtml = `
          ${step.sourceQuote ? `<div class="source-box" style="white-space:pre-line;">${step.sourceQuote}</div>` : ''}
          <p style="font-weight:700;margin-bottom:10px;">${step.question}</p>
          ${!isStepSolved ? `
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
              <input type="text" id="stepTextInput" placeholder="${step.placeholder || '정답 입력'}"
                onkeydown="if(event.key==='Enter') submitTextStep()"
                style="flex:1;min-width:200px;padding:12px;border-radius:10px;border:2px solid var(--indigo);" />
              <button type="button" class="btn-primary" onclick="submitTextStep()">확인</button>
            </div>
          ` : ''}
        `;
      } else if (step.type === 'cipher_disk') {
        puzzleBodyHtml = `
          <p style="font-weight:700;margin-bottom:8px;">${step.question}</p>
          <div id="cipherDiskMount"></div>
          ${!isStepSolved ? `
            <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;">
              <input type="text" id="stepTextInput" placeholder="${step.placeholder || '해독한 낱말 입력'}"
                onkeydown="if(event.key==='Enter') submitTextStep()"
                style="flex:1;min-width:200px;padding:12px;border-radius:10px;border:2px solid var(--indigo);" />
              <button type="button" class="btn-primary" onclick="submitTextStep()">해독 완료 확인</button>
            </div>
          ` : ''}
        `;
      } else if (step.type === 'dial_3' || step.type === 'dial_4') {
        const count = step.type === 'dial_3' ? 3 : 4;
        puzzleBodyHtml = `
          ${step.sourceQuote ? `<div class="source-box" style="white-space:pre-line;">${step.sourceQuote}</div>` : ''}
          <p style="font-weight:700;margin-bottom:8px;">${step.question}</p>
          ${!isStepSolved ? `
            <div class="dial-row">
              ${Array.from({ length: count }).map((_, i) => `
                <div class="dial-unit">
                  <button type="button" onclick="spinStepDial(${i}, 1)">▲</button>
                  <div class="dial-val">${stepLocalState.dials[i] || 0}</div>
                  <button type="button" onclick="spinStepDial(${i}, -1)">▼</button>
                </div>
              `).join('')}
            </div>
            <button type="button" class="btn-primary" style="width:100%;" onclick="submitDialStep(${count})">🔓 다이얼 자물쇠 열기</button>
          ` : ''}
        `;
      } else if (step.type === 'select_n') {
        puzzleBodyHtml = `
          ${step.sourceQuote ? `<div class="source-box" style="white-space:pre-line;">${step.sourceQuote}</div>` : ''}
          <p style="font-weight:700;margin-bottom:8px;">${step.question} <span style="color:var(--indigo);">(선택: ${stepLocalState.selectedOptions.length} / ${step.pickCount}개)</span></p>
          <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));gap:8px;margin-bottom:12px;">
            ${step.options.map((opt, idx) => {
              const selected = stepLocalState.selectedOptions.includes(idx);
              return `
                <button type="button" class="${selected ? 'btn-primary' : 'btn-outline'}"
                  style="text-align:left;justify-content:flex-start;font-size:0.95rem;"
                  onclick="toggleSelectOption(${idx}, ${step.pickCount})">
                  ${selected ? '☑️' : '⬜'} ${opt.text}
                </button>
              `;
            }).join('')}
          </div>
          ${!isStepSolved ? `<button type="button" class="btn-primary" style="width:100%;" onclick="submitSelectNStep()">선택 완료 확인</button>` : ''}
        `;
      } else if (step.type === 'order_seq') {
        puzzleBodyHtml = `
          <p style="font-weight:700;margin-bottom:8px;">${step.question}</p>
          <div style="background:var(--bg-card-sub);border:1.5px dashed var(--indigo);border-radius:10px;padding:12px;margin-bottom:10px;min-height:58px;">
            <div style="font-size:0.84rem;color:var(--ink-soft);margin-bottom:6px;">배열된 순서 (${stepLocalState.orderedList.length} / ${step.cards.length}):</div>
            <div style="display:flex;flex-wrap:wrap;gap:6px;">
              ${stepLocalState.orderedList.map((c, idx) => `
                <span class="tag tag-web" style="font-size:0.9rem;padding:5px 10px;">${idx + 1}. ${c}</span>
              `).join('')}
            </div>
          </div>
          <div style="display:grid;gap:8px;margin-bottom:12px;">
            ${step.cards.map(c => {
              const used = stepLocalState.orderedList.includes(c);
              return `
                <button type="button" class="btn-outline" ${used ? 'disabled' : ''} style="text-align:left;"
                  onclick="pushOrderCard('${c.replace(/'/g, "\\'")}')">
                  ${used ? '✓ 배치됨 · ' : '+ '} ${c}
                </button>
              `;
            }).join('')}
          </div>
          ${!isStepSolved ? `
            <div style="display:flex;gap:8px;">
              <button type="button" class="btn-outline" onclick="resetOrderCards()">↺ 다시 놓기</button>
              <button type="button" class="btn-primary" style="flex:1;" onclick="submitOrderSeqStep()">순서 확인</button>
            </div>
          ` : ''}
        `;
      } else if (step.type === 'bucket_sort') {
        const unplaced = step.cards.map((c, idx) => ({ ...c, idx })).filter(c => !stepLocalState.bucketPlacements[c.idx]);
        puzzleBodyHtml = `
          <p style="font-weight:700;margin-bottom:8px;">${step.question}</p>
          <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(240px, 1fr));gap:10px;margin-bottom:12px;">
            ${step.buckets.map(b => {
              const placedHere = step.cards.map((c, idx) => ({ ...c, idx })).filter(c => stepLocalState.bucketPlacements[c.idx] === b.id);
              return `
                <div onclick="placeInBucket('${b.id}')" style="cursor:pointer;border:2px solid ${b.id === 'limit' ? 'var(--indigo)' : 'var(--ochre)'};border-radius:12px;padding:12px;background:var(--bg-card-sub);min-height:130px;">
                  <strong style="display:block;margin-bottom:8px;color:${b.id === 'limit' ? 'var(--indigo)' : 'var(--ochre)'};">${b.label} (여기를 눌러 담기)</strong>
                  <div style="display:grid;gap:6px;">
                    ${placedHere.map(c => `
                      <div onclick="event.stopPropagation();removeFromBucket(${c.idx})" style="background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:8px;font-size:0.86rem;">
                        ${c.text} ${isStepSolved ? `<strong style="color:var(--emerald);display:block;margin-top:3px;">[${c.source}]</strong>` : '<span style="color:var(--ink-soft);font-size:0.78rem;"> (누르면 빼기)</span>'}
                      </div>
                    `).join('')}
                  </div>
                </div>
              `;
            }).join('')}
          </div>

          ${unplaced.length > 0 ? `
            <div style="margin-bottom:12px;">
              <div style="font-size:0.86rem;font-weight:700;margin-bottom:6px;">분류할 조항 카드 (카드를 먼저 누른 뒤 위 바구니를 누르시오):</div>
              <div style="display:grid;gap:6px;">
                ${unplaced.map(c => {
                  const active = stepLocalState.selectedBucketCard === c.idx;
                  return `
                    <button type="button" class="${active ? 'btn-primary' : 'btn-outline'}" style="text-align:left;font-size:0.9rem;line-height:1.45;"
                      onclick="selectBucketCard(${c.idx})">
                      ${active ? '👉 [선택됨] ' : ''}${c.text}
                    </button>
                  `;
                }).join('')}
              </div>
            </div>
          ` : ''}

          ${!isStepSolved ? `<button type="button" class="btn-primary" style="width:100%;" onclick="submitBucketSortStep()">분류 결과 확인</button>` : ''}
        `;
      } else if (step.type === 'anamorphic') {
        const angle = stepLocalState.anamorphicVal || 0;
        // angle 0 -> scaleY = 7, angle 100 -> scaleY = 1
        const scaleY = (7 - (angle / 100) * 6).toFixed(2);
        puzzleBodyHtml = `
          <p style="font-weight:700;margin-bottom:8px;">${step.question}</p>
          <div style="background:#fbf5e6;border:2px solid var(--border);border-radius:12px;padding:14px;text-align:center;margin-bottom:12px;overflow:hidden;">
            <svg viewBox="0 0 320 150" style="width:100%;max-width:360px;height:150px;">
              <g transform="translate(160, 75) scale(1, ${scaleY})">
                <text x="0" y="0" text-anchor="middle" dominant-baseline="central" font-family="'Gowun Batang', serif" font-size="38" font-weight="700" fill="#1d3c63" letter-spacing="8">
                  石島 석도
                </text>
              </g>
            </svg>
            <div style="max-width:340px;margin:8px auto 0;">
              <label for="anamorphicSlider" style="display:block;font-size:0.88rem;font-weight:700;color:var(--indigo);margin-bottom:4px;">
                📐 보는 각도 조절 슬라이더: ${angle}%
              </label>
              <input type="range" id="anamorphicSlider" min="0" max="100" value="${angle}"
                oninput="updateAnamorphic(this.value)" style="width:100%;height:32px;cursor:pointer;" />
            </div>
          </div>
          ${!isStepSolved ? `
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
              <input type="text" id="stepTextInput" placeholder="${step.placeholder || '정답 입력'}"
                onkeydown="if(event.key==='Enter') submitTextStep()"
                style="flex:1;min-width:200px;padding:12px;border-radius:10px;border:2px solid var(--indigo);" />
              <button type="button" class="btn-primary" onclick="submitTextStep()">확인</button>
            </div>
          ` : ''}
        `;
      }

      stage.innerHTML = `
        <div>
          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px;">
            <button class="btn-outline" onclick="goToHub()">◀ 배달 허브로</button>
            <div style="display:flex;gap:6px;">
              ${[0, 1, 2].map(i => `
                <span class="tag ${i === stepIdx ? 'tag-web' : (i < st.step || st.done ? 'tag-done' : '')}"
                  style="${i === stepIdx || i < st.step || st.done ? '' : 'background:var(--bg-card);border:1px solid var(--border);'}">
                  ${i + 1}단계 ${i < st.step || st.done ? '✓' : ''}
                </span>
              `).join('')}
            </div>
          </div>

          <!-- 편지 원문 접기/펼치기 -->
          <div class="card" style="padding:16px;">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer;" onclick="toggleLetterBody()">
              <div style="display:flex;align-items:center;gap:10px;">
                ${safeImg(lt.portrait, lt.sender, 'sender-avatar')}
                <div>
                  <span class="tag ${id === 'l1' || id === 'l2' ? 'tag-web' : 'tag-phys'}">${lt.pairLabel}</span>
                  <h2 class="serif" style="font-size:1.25rem;margin-top:3px;">${lt.title} · ${lt.sender}</h2>
                </div>
              </div>
              <button type="button" class="btn-outline" style="min-height:38px;padding:6px 12px;font-size:0.86rem;">
                ${stepLocalState.letterOpen ? '편지 접기 ▲' : '편지 펼치기 ▼'}
              </button>
            </div>

            ${stepLocalState.letterOpen ? `
              <div style="margin-top:12px;">
                ${safeImg(lt.bg, lt.title, '', 'width:100%;max-height:170px;object-fit:cover;border-radius:10px;margin-bottom:10px;')}
                <div class="letter-paper" style="white-space:pre-line;">${lt.body}</div>
              </div>
            ` : ''}
          </div>

          <!-- 현재 단계 퍼즐 카드 -->
          <div class="card ${step.mode === 'physical' ? 'card-physical' : 'card-web'}">
            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:10px;">
              <span class="tag ${step.mode === 'physical' ? 'tag-phys' : 'tag-web'}">
                ${step.mode === 'physical' ? '🔐 교실 실물 활동' : '💻 웹 태블릿 활동'}
              </span>
            </div>
            <h3 class="serif" style="font-size:1.25rem;margin-bottom:12px;">${step.title}</h3>

            ${puzzleBodyHtml}

            ${stepLocalState.wrongMsg ? `
              <div style="margin-top:12px;background:var(--vermilion-tint);border:1.5px solid var(--vermilion);color:var(--vermilion);padding:12px 14px;border-radius:10px;font-weight:700;">
                ⚠️ ${stepLocalState.wrongMsg}
              </div>
            ` : ''}

            <!-- 복동에게 묻기 (2단계 힌트) -->
            ${!isStepSolved ? `
              <div style="margin-top:16px;padding-top:12px;border-top:1px dashed var(--border);display:flex;flex-wrap:wrap;gap:8px;">
                <button type="button" class="btn-outline" style="font-size:0.9rem;min-height:40px;" onclick="unlockHint('${h1Key}', 0)">
                  💡 복동에게 묻기 1단계 (무료)
                </button>
                <button type="button" class="btn-outline" style="font-size:0.9rem;min-height:40px;" onclick="unlockHint('${h2Key}', 1)">
                  🔑 복동에게 묻기 2단계 (${gameState.freeSecondHintVoucher > 0 ? '무료권 1장 사용' : '힌트 우표 1장 차감'})
                </button>
              </div>
            ` : ''}

            ${h1Open ? `
              <div style="margin-top:10px;background:var(--bg-card-sub);border-left:4px solid var(--ochre);padding:10px 14px;border-radius:8px;font-size:0.94rem;">
                <strong>💡 1단계 귀띔:</strong> ${step.hint1}
              </div>
            ` : ''}
            ${h2Open ? `
              <div style="margin-top:8px;background:var(--ochre-bg);border-left:4px solid var(--vermilion);padding:10px 14px;border-radius:8px;font-size:0.94rem;">
                <strong>🔑 2단계 핵심 귀띔:</strong> ${step.hint2}
              </div>
            ` : ''}

            <!-- 단계 성공 시 역사 해설 및 다음 진행 -->
            ${isStepSolved ? `
              <div style="margin-top:16px;background:var(--emerald-tint);border:2px solid var(--emerald);color:var(--emerald);padding:16px;border-radius:12px;">
                <strong style="display:block;font-size:1.05rem;margin-bottom:6px;">✅ 해결 완료! 역사 해설</strong>
                <p style="white-space:pre-line;color:var(--ink);font-size:0.96rem;">${step.successText}</p>
                ${stepIdx === 2 ? `
                  <div style="margin-top:12px;padding:12px;background:#fff;border:1.5px solid var(--vermilion);border-radius:10px;display:flex;align-items:center;gap:12px;">
                    ${safeImg('stamp_ring.png', '도장 획득', '', 'width:52px;height:52px;object-fit:contain;flex-shrink:0;')}
                    <div>
                      <strong style="color:var(--vermilion);display:block;">💮 도장 ${lt.num} 획득 완료!</strong>
                      <span style="font-size:0.88rem;color:var(--ink-soft);">다른 기기에서 도장을 불러올 때 이 편지 3단계의 정답(배달 확인 암호)을 입력하시오.</span>
                    </div>
                  </div>
                ` : ''}
                <div style="margin-top:14px;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;">
                  ${stepIdx < 2 ? `
                    <button type="button" class="btn-primary" onclick="advanceLetterStep()">다음 단계(${stepIdx + 2}/3)로 ▶</button>
                  ` : `
                    <button type="button" class="btn-outline" onclick="goToHub()">배달 허브로 돌아가기</button>
                    <button type="button" class="btn-vermilion" onclick="goToMeta()">💮 레이어드 스탬프로 이동 ▶</button>
                  `}
                </div>
              </div>
            ` : ''}
          </div>
        </div>
      `;

      if (step.type === 'cipher_disk') {
        renderCipherDiskComponent({
          cipherChars: step.cipherChars,
          keySchedule: step.keySchedule,
          containerId: 'cipherDiskMount'
        });
      }
    }

    function toggleLetterBody() {
      stepLocalState.letterOpen = !stepLocalState.letterOpen;
      renderApp();
    }

    function unlockHint(key, cost) {
      if (gameState.usedHints[key]) return;
      if (cost > 0) {
        if (gameState.freeSecondHintVoucher > 0) {
          gameState.freeSecondHintVoucher -= 1;
          showToast('22분 무료권을 사용하여 2단계 귀띔을 열었습니다!');
        } else if (gameState.hintStamps > 0) {
          gameState.hintStamps -= 1;
          showToast('힌트 우표 1장을 사용하여 2단계 귀띔을 열었습니다.');
        } else {
          showToast('남은 힌트 우표가 없습니다. 교과서와 편지를 다시 살펴보시오!');
          return;
        }
      }
      gameState.usedHints[key] = true;
      saveState();
      updateHud();
      renderApp();
    }

    function markCurrentStepSolved() {
      const id = gameState.activeLetterId;
      const st = gameState.letters[id];
      const stepIdx = st.step;
      gameState.usedHints[`${id}_${stepIdx}_solved`] = true;
      stepLocalState.wrongMsg = '';

      if (stepIdx === 2) {
        st.done = true;
        SoundFX.playStamp();
      } else {
        SoundFX.playSuccess();
      }
      saveState();
      renderApp();
    }

    function advanceLetterStep() {
      const id = gameState.activeLetterId;
      const st = gameState.letters[id];
      if (st.step < 2) {
        st.step += 1;
        resetStepLocalState();
        saveState();
        renderApp();
      }
    }

    function selectMatchChoice(itemIdx, choice) {
      stepLocalState.matching[itemIdx] = choice;
      stepLocalState.wrongMsg = '';
      renderApp();
    }

    function submitMatchingStep() {
      const sc = teacherConfig.part === 1 ? SCENARIO_DATA.part1 : SCENARIO_DATA.part2;
      const step = sc.letters[gameState.activeLetterId].steps[gameState.letters[gameState.activeLetterId].step];
      const allCorrect = step.items.every((it, idx) => stepLocalState.matching[idx] === it.answer);
      if (allCorrect) {
        markCurrentStepSolved();
      } else {
        stepLocalState.wrongMsg = step.wrongFeedback;
        renderApp();
      }
    }

    function completePhysicalStep() {
      markCurrentStepSolved();
    }

    function pushVirtualDir(arrow) {
      if (stepLocalState.orderedList.length < 8) {
        stepLocalState.orderedList.push(arrow);
        stepLocalState.wrongMsg = '';
        renderApp();
      }
    }

    function resetVirtualDir() {
      stepLocalState.orderedList = [];
      stepLocalState.wrongMsg = '';
      renderApp();
    }

    function checkVirtualDirLock() {
      const expected = teacherConfig.part === 1 ? teacherConfig.vLockDirP1 : teacherConfig.vLockDirP2;
      const attempt = stepLocalState.orderedList.join('');
      if (attempt === expected) {
        markCurrentStepSolved();
      } else {
        stepLocalState.wrongMsg = '방향 순서가 맞지 않소. "고리 2번 누르기(초기화)"를 누른 뒤 다시 입력하시오.';
        renderApp();
      }
    }

    function spinEngDial(idx, delta) {
      stepLocalState.dials[idx] = ((stepLocalState.dials[idx] || 0) + delta + 26) % 26;
      stepLocalState.wrongMsg = '';
      renderApp();
    }

    function checkVirtualEngLock() {
      const expected = (teacherConfig.part === 1 ? teacherConfig.vLockEngP1 : teacherConfig.vLockEngP2).toUpperCase();
      const attempt = stepLocalState.dials.slice(0, 5).map(n => String.fromCharCode(65 + ((n % 26 + 26) % 26))).join('');
      if (attempt === expected) {
        markCurrentStepSolved();
      } else {
        stepLocalState.wrongMsg = '다섯 글자 영어 단어가 맞지 않소. 사건 카드 순서를 다시 확인하시오.';
        renderApp();
      }
    }

    function submitTextStep() {
      const val = document.getElementById('stepTextInput')?.value || '';
      const sc = teacherConfig.part === 1 ? SCENARIO_DATA.part1 : SCENARIO_DATA.part2;
      const step = sc.letters[gameState.activeLetterId].steps[gameState.letters[gameState.activeLetterId].step];
      if (verifyAnswer(val, step.answerHashes)) {
        markCurrentStepSolved();
      } else {
        stepLocalState.wrongMsg = step.wrongFeedback;
        renderApp();
      }
    }

    function spinStepDial(idx, delta) {
      stepLocalState.dials[idx] = ((stepLocalState.dials[idx] || 0) + delta + 10) % 10;
      stepLocalState.wrongMsg = '';
      renderApp();
    }

    function submitDialStep(count) {
      const sc = teacherConfig.part === 1 ? SCENARIO_DATA.part1 : SCENARIO_DATA.part2;
      const step = sc.letters[gameState.activeLetterId].steps[gameState.letters[gameState.activeLetterId].step];
      const attempt = stepLocalState.dials.slice(0, count).join('');
      if (verifyAnswer(attempt, step.answerHashes)) {
        markCurrentStepSolved();
      } else {
        stepLocalState.wrongMsg = step.wrongFeedback;
        renderApp();
      }
    }

    function toggleSelectOption(idx, pickCount) {
      const arr = stepLocalState.selectedOptions;
      const pos = arr.indexOf(idx);
      if (pos >= 0) {
        arr.splice(pos, 1);
      } else {
        if (arr.length >= pickCount) arr.shift();
        arr.push(idx);
      }
      stepLocalState.wrongMsg = '';
      renderApp();
    }

    function submitSelectNStep() {
      const sc = teacherConfig.part === 1 ? SCENARIO_DATA.part1 : SCENARIO_DATA.part2;
      const step = sc.letters[gameState.activeLetterId].steps[gameState.letters[gameState.activeLetterId].step];
      if (stepLocalState.selectedOptions.length !== step.pickCount) {
        stepLocalState.wrongMsg = `정확히 ${step.pickCount}개를 선택해야 하오.`;
        renderApp();
        return;
      }
      const allTarget = stepLocalState.selectedOptions.every(i => step.options[i]?.isTarget);
      if (allTarget) {
        markCurrentStepSolved();
      } else {
        stepLocalState.wrongMsg = step.wrongFeedback;
        renderApp();
      }
    }

    function pushOrderCard(cardText) {
      if (!stepLocalState.orderedList.includes(cardText)) {
        stepLocalState.orderedList.push(cardText);
        stepLocalState.wrongMsg = '';
        renderApp();
      }
    }

    function resetOrderCards() {
      stepLocalState.orderedList = [];
      stepLocalState.wrongMsg = '';
      renderApp();
    }

    function submitOrderSeqStep() {
      const sc = teacherConfig.part === 1 ? SCENARIO_DATA.part1 : SCENARIO_DATA.part2;
      const step = sc.letters[gameState.activeLetterId].steps[gameState.letters[gameState.activeLetterId].step];
      if (stepLocalState.orderedList.length !== step.correctOrder.length) {
        stepLocalState.wrongMsg = '다섯 장의 사건 카드를 모두 순서대로 배치하시오.';
        renderApp();
        return;
      }
      const ok = step.correctOrder.every((val, idx) => stepLocalState.orderedList[idx] === val);
      if (ok) {
        markCurrentStepSolved();
      } else {
        stepLocalState.wrongMsg = step.wrongFeedback;
        renderApp();
      }
    }

    function selectBucketCard(cardIdx) {
      stepLocalState.selectedBucketCard = cardIdx;
      stepLocalState.wrongMsg = '';
      renderApp();
    }

    function placeInBucket(bucketId) {
      if (stepLocalState.selectedBucketCard === null) {
        showToast('먼저 아래의 조항 카드를 하나 누르세요.');
        return;
      }
      stepLocalState.bucketPlacements[stepLocalState.selectedBucketCard] = bucketId;
      stepLocalState.selectedBucketCard = null;
      stepLocalState.wrongMsg = '';
      renderApp();
    }

    function removeFromBucket(cardIdx) {
      delete stepLocalState.bucketPlacements[cardIdx];
      renderApp();
    }

    function submitBucketSortStep() {
      const sc = teacherConfig.part === 1 ? SCENARIO_DATA.part1 : SCENARIO_DATA.part2;
      const step = sc.letters[gameState.activeLetterId].steps[gameState.letters[gameState.activeLetterId].step];
      if (Object.keys(stepLocalState.bucketPlacements).length !== step.cards.length) {
        stepLocalState.wrongMsg = '일곱 장의 카드를 모두 두 바구니 중 하나에 담으시오.';
        renderApp();
        return;
      }
      const ok = step.cards.every((c, idx) => stepLocalState.bucketPlacements[idx] === c.bucket);
      if (ok) {
        markCurrentStepSolved();
      } else {
        stepLocalState.wrongMsg = step.wrongFeedback;
        renderApp();
      }
    }

    function updateAnamorphic(val) {
      stepLocalState.anamorphicVal = Number(val);
      renderApp();
    }

    /* =========================================================================
     * 11. 메타 퍼즐 (레이어드 스탬프), 최종 나무상자, 엔딩 화면
     * ========================================================================= */
    function goToMeta() {
      gameState.screen = 'meta';
      saveState();
      renderApp();
    }

    function rotateStamp(idx) {
      const keys = ['l1', 'l2', 'l3', 'l4'];
      if (!gameState.letters[keys[idx]].done) return;
      gameState.stampRotations[idx] = (gameState.stampRotations[idx] + 1) % 4;
      SoundFX.playStamp();
      saveState();
      renderApp();
    }

    function syncStampByCode(idx) {
      const sc = teacherConfig.part === 1 ? SCENARIO_DATA.part1 : SCENARIO_DATA.part2;
      const keys = ['l1', 'l2', 'l3', 'l4'];
      const lt = sc.letters[keys[idx]];
      const inputEl = document.getElementById(`syncInput_${idx}`);
      const val = inputEl ? inputEl.value : '';
      if (verifyAnswer(val, makeHashes(lt.confirmCodes))) {
        gameState.letters[keys[idx]].done = true;
        gameState.letters[keys[idx]].step = 3;
        SoundFX.playStamp();
        saveState();
        showToast(`💮 ${lt.title} 도장을 불러왔습니다!`);
        renderApp();
      } else {
        showToast('배달 확인 암호(해당 편지 3단계의 최종 정답)가 일치하지 않습니다.');
      }
    }

    function renderMetaStage(stage, sc) {
      const meta = sc.meta;
      const keys = ['l1', 'l2', 'l3', 'l4'];
      const allUnlocked = keys.every(k => gameState.letters[k].done);

      // 아직 잠긴 도장은 정답 각도가 드러나지 않도록 의도적으로 어긋난 각도를 전달
      const effectiveRotations = keys.map((k, idx) => {
        if (gameState.letters[k].done) return gameState.stampRotations[idx];
        return (meta.stamps[idx].targetRot + 2) % 4;
      });

      const { allAligned, svg } = renderLayeredMetaSVG(teacherConfig.part, effectiveRotations);
      const isComplete = allUnlocked && allAligned;

      if (isComplete && !gameState.metaSolved) {
        gameState.metaSolved = true;
        SoundFX.playSuccess();
        saveState();
      }

      stage.innerHTML = `
        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px;">
            <button class="btn-outline" onclick="goToHub()">◀ 배달 허브로</button>
            <span class="tag tag-stamp" style="background:var(--vermilion-tint);color:var(--vermilion);">메타 퍼즐 · 레이어드 스탬프</span>
          </div>

          <h2 class="serif" style="font-size:1.4rem;color:var(--indigo);margin-bottom:6px;">${meta.title}</h2>
          <p style="font-size:0.94rem;color:var(--ink-soft);margin-bottom:14px;">${meta.guide}</p>

          <!-- 4겹 합성 엽서/약도 영역 -->
          <div style="text-align:center;margin-bottom:18px;position:relative;">
            ${svg}
            ${!allUnlocked ? `
              <p style="font-size:0.86rem;color:var(--vermilion);font-weight:700;margin-top:6px;">
                ※ 도장 4개를 모두 모아야 겹쳐진 그림이 온전히 드러납니다. 다른 짝 기기의 도장은 아래에서 '배달 확인 암호'로 불러오시오.
              </p>
            ` : ''}
          </div>

          ${isComplete ? `
            <div style="background:var(--emerald-tint);border:2px solid var(--emerald);color:var(--emerald);padding:16px;border-radius:12px;margin-bottom:16px;text-align:center;">
              <strong style="display:block;font-size:1.08rem;margin-bottom:8px;">🎉 ${meta.completeMsg}</strong>
              <button class="btn-primary" style="font-size:1.05rem;" onclick="goToFinal()">
                📦 나무상자 열기 및 엔딩 암호 입력 ▶
              </button>
            </div>
          ` : ''}

          <!-- 도장 4개 컨트롤 그리드 -->
          <div class="stamps-grid">
            ${meta.stamps.map((stInfo, idx) => {
              const unlocked = gameState.letters[stInfo.id].done;
              const rot = gameState.stampRotations[idx];
              if (!unlocked) {
                return `
                  <div class="stamp-card" style="border-style:dashed;">
                    <div style="width:96px;height:96px;border-radius:50%;border:2px dashed var(--border);margin:4px auto 10px;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);font-weight:700;">
                      ${stInfo.label} 미획득
                    </div>
                    <p style="font-size:0.85rem;color:var(--ink-soft);margin-bottom:8px;">
                      다른 기기에서 푼 편지 ${['①','②','③','④'][idx]}의 <strong>배달 확인 암호</strong> 입력
                    </p>
                    <div style="display:flex;gap:6px;">
                      <input type="text" id="syncInput_${idx}" placeholder="확인 암호" style="flex:1;min-width:80px;padding:8px;border-radius:8px;border:1px solid var(--border);font-size:0.9rem;" />
                      <button type="button" class="btn-outline" style="min-height:40px;padding:6px 10px;font-size:0.85rem;" onclick="syncStampByCode(${idx})">불러오기</button>
                    </div>
                  </div>
                `;
              }

              // 4방향 라벨 배치 (위 0, 오른쪽 1, 아래 2, 왼쪽 3) -> 시계방향 rot만큼 회전
              return `
                <div class="stamp-card" style="border-color:var(--vermilion);">
                  <div style="font-size:0.86rem;font-weight:700;color:var(--indigo);margin-bottom:6px;min-height:42px;">
                    ${stInfo.label}. ${stInfo.q}
                  </div>
                  <div onclick="rotateStamp(${idx})" style="cursor:pointer;position:relative;width:190px;height:190px;margin:0 auto 8px;user-select:none;">
                    <div style="position:absolute;top:-6px;left:50%;transform:translateX(-50%);color:var(--vermilion);font-weight:700;font-size:1rem;z-index:2;">▼ ▲</div>
                    <svg viewBox="0 0 200 200" style="width:100%;height:100%;transition:transform 0.25s ease;transform:rotate(${rot * 90}deg);">
                      <circle cx="100" cy="100" r="90" fill="rgba(184,32,32,0.06)" stroke="#b82020" stroke-width="4" />
                      <circle cx="100" cy="100" r="56" fill="none" stroke="#b82020" stroke-width="2" stroke-dasharray="4 3" />
                      <text x="100" y="100" text-anchor="middle" dominant-baseline="central" font-family="'Gowun Batang', serif" font-size="24" font-weight="700" fill="#b82020">
                        ${['①','②','③','④'][idx]}
                      </text>
                      <!-- 위(0) -->
                      <text x="100" y="28" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="700" fill="#b82020">${stInfo.choices[0]}</text>
                      <!-- 오른쪽(1) -->
                      <g transform="translate(172, 100) rotate(90)">
                        <text x="0" y="0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="700" fill="#b82020">${stInfo.choices[1]}</text>
                      </g>
                      <!-- 아래(2) -->
                      <g transform="translate(100, 172) rotate(180)">
                        <text x="0" y="0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="700" fill="#b82020">${stInfo.choices[2]}</text>
                      </g>
                      <!-- 왼쪽(3) -->
                      <g transform="translate(28, 100) rotate(270)">
                        <text x="0" y="0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="700" fill="#b82020">${stInfo.choices[3]}</text>
                      </g>
                    </svg>
                  </div>
                  <button type="button" class="btn-outline" style="width:100%;min-height:40px;font-size:0.88rem;color:var(--vermilion);border-color:var(--vermilion);" onclick="rotateStamp(${idx})">
                    ↻ 도장 90° 돌리기
                  </button>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function goToFinal() {
      gameState.screen = 'final';
      resetStepLocalState();
      saveState();
      renderApp();
    }

    function renderFinalStage(stage, sc) {
      const f = sc.final;
      stage.innerHTML = `
        <div class="card card-physical" style="text-align:center;">
          <div style="text-align:left;margin-bottom:8px;">
            <button class="btn-outline" onclick="goToMeta()">◀ 레이어드 스탬프로</button>
          </div>
          <span class="tag tag-phys" style="margin-bottom:8px;">최종 관문 · 나무상자(기록 상자)</span>
          <h2 class="serif" style="font-size:1.5rem;color:var(--ochre);margin-bottom:10px;">기록 상자를 열고 엔딩 암호를 입력하시오</h2>

          <div style="margin:12px auto;">
            ${safeImg('record_box_closed.png', '나무상자', '', 'width:190px;height:150px;object-fit:contain;margin:0 auto;')}
          </div>

          <div class="source-box" style="max-width:520px;margin:0 auto 16px;text-align:left;">
            <strong>📦 ${f.instruction}</strong>
          </div>

          <div style="max-width:420px;margin:0 auto;">
            <label for="endingCodeInput" style="display:block;font-weight:700;margin-bottom:6px;">상자 속 쪽지에 적힌 엔딩 암호 (두 글자)</label>
            <input type="text" id="endingCodeInput" placeholder="엔딩 암호 입력"
              onkeydown="if(event.key==='Enter') submitEndingCode()"
              style="width:100%;padding:12px;border-radius:10px;border:2px solid var(--indigo);text-align:center;font-size:1.15rem;margin-bottom:12px;" />
            <button type="button" class="btn-primary" style="width:100%;font-size:1.1rem;" onclick="submitEndingCode()">
              ✨ 엔딩 암호 확인 및 배달 완수
            </button>
          </div>

          ${stepLocalState.wrongMsg ? `
            <div style="margin-top:12px;background:var(--vermilion-tint);color:var(--vermilion);padding:10px 14px;border-radius:10px;font-weight:700;">
              ⚠️ ${stepLocalState.wrongMsg}
            </div>
          ` : ''}
        </div>
      `;
    }

    function submitEndingCode() {
      const sc = teacherConfig.part === 1 ? SCENARIO_DATA.part1 : SCENARIO_DATA.part2;
      const val = document.getElementById('endingCodeInput')?.value || '';
      if (verifyAnswer(val, sc.final.endingHashes)) {
        gameState.finalSolved = true;
        gameState.screen = 'ending';
        gameState.prologueIdx = 0;
        SoundFX.playSuccess();
        saveState();
        renderApp();
      } else {
        stepLocalState.wrongMsg = sc.final.wrongFeedback;
        renderApp();
      }
    }

    function renderEndingStage(stage, sc) {
      const slides = sc.ending;
      const idx = Math.min(gameState.prologueIdx, slides.length - 1);
      const slide = slides[idx];

      const elapsedSec = Math.max(0, 40 * 60 - gameState.remainingSeconds);
      const grade = gameState.hintStamps >= 5 ? '금' : gameState.hintStamps >= 3 ? '은' : '동';
      const medalImg = grade === '금' ? 'medal_gold.png' : (grade === '은' ? 'medal_silver.png' : 'medal_bronze.png');

      let bodyHtml = '';
      if (slide.type === 'grade') {
        bodyHtml = `
          <div style="text-align:center;padding:12px 0;">
            ${safeImg(medalImg, `${grade}등급 메달`, '', 'width:130px;height:130px;object-fit:contain;margin:0 auto 10px;')}
            <h3 class="serif" style="font-size:1.5rem;color:var(--indigo);margin-bottom:6px;">배달 등급 : [${grade}등급]</h3>
            <p style="font-size:1.05rem;font-weight:700;">
              모둠: ${gameState.teamName} · 소요 시간: ${formatTime(elapsedSec)} · 남은 힌트 우표: ${gameState.hintStamps}장
            </p>
          </div>
        `;
      } else if (slide.type === 'reply') {
        bodyHtml = `
          ${slide.bg ? `<div style="margin-bottom:12px;">${safeImg(slide.bg, '2026년 귀환', '', 'width:100%;max-height:220px;object-fit:cover;border-radius:12px;')}</div>` : ''}
          ${teacherConfig.part === 2 ? `
            <div style="text-align:center;background:var(--bg-card-sub);border:1.5px solid var(--border);border-radius:12px;padding:12px;margin-bottom:12px;">
              ${safeImg(medalImg, `${grade}등급 메달`, '', 'width:84px;height:84px;object-fit:contain;margin:0 auto 4px;')}
              <strong style="color:var(--indigo);">배달 등급: [${grade}등급] · 소요 시간: ${formatTime(elapsedSec)} · 남은 우표: ${gameState.hintStamps}장</strong>
            </div>
          ` : ''}
          <div class="source-box" style="white-space:pre-line;margin-bottom:12px;">${slide.prompt}</div>
          <label for="studentReplyInput" style="display:block;font-weight:700;margin-bottom:6px;">✍️ 복동에게 보내는 세 줄 답장 (선생님께 전송)</label>
          <textarea id="studentReplyInput" rows="3" placeholder="이곳에 모둠의 다짐과 답장을 세 줄로 적으시오..."
            style="width:100%;padding:12px;border-radius:10px;border:2px solid var(--indigo);margin-bottom:10px;">${gameState.studentReply}</textarea>

          <button id="btnSendResult" type="button" class="btn-primary" style="width:100%;font-size:1.05rem;" onclick="submitResultToTeacher()" ${gameState.resultSubmitted ? 'disabled' : ''}>
            ${gameState.resultSubmitted ? '✅ 선생님께 배달 결과 전송 완료' : '📮 선생님께 배달 결과 전송'}
          </button>

          <p style="margin-top:16px;padding-top:12px;border-top:1px solid var(--border);font-size:0.84rem;color:var(--ink-soft);text-align:center;">
            복동과 편지를 쓴 사람들은 지어낸 인물입니다. 사건과 사료는 『역사②』를 따랐습니다. 일부 그림은 AI로 만들었습니다.
          </p>
        `;
      } else {
        bodyHtml = `
          ${slide.bg ? `<div style="margin-bottom:12px;">${safeImg(slide.bg, slide.title, '', 'width:100%;max-height:240px;object-fit:cover;border-radius:12px;')}</div>` : ''}
          <div style="display:flex;align-items:center;gap:14px;background:var(--bg-card-sub);padding:16px;border-radius:12px;border:1px solid var(--border);">
            ${slide.prop ? safeImg(slide.prop, '상자', '', 'width:96px;height:80px;object-fit:contain;flex-shrink:0;') : ''}
            ${slide.char ? safeImg(slide.char, '복동', '', 'width:80px;height:100px;object-fit:contain;flex-shrink:0;') : ''}
            <p class="serif" style="white-space:pre-line;font-size:1.04rem;">${slide.text}</p>
          </div>
        `;
      }

      stage.innerHTML = `
        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
            <span class="tag tag-done">엔딩 ${idx + 1} / ${slides.length}</span>
            <span style="font-size:0.88rem;color:var(--ink-soft);">${gameState.teamName}</span>
          </div>
          <h2 class="serif" style="font-size:1.35rem;color:var(--indigo);margin-bottom:12px;">${slide.title}</h2>
          ${bodyHtml}
          <div style="display:flex;justify-content:space-between;margin-top:16px;gap:10px;">
            ${idx > 0 ? `<button class="btn-outline" onclick="moveEnding(-1)">◀ 이전</button>` : `<div></div>`}
            ${idx < slides.length - 1 ? `<button class="btn-primary" onclick="moveEnding(1)">다음 ▶</button>` : `<div></div>`}
          </div>
        </div>
      `;
    }

    function moveEnding(delta) {
      const sc = teacherConfig.part === 1 ? SCENARIO_DATA.part1 : SCENARIO_DATA.part2;
      const next = gameState.prologueIdx + delta;
      if (next >= 0 && next < sc.ending.length) {
        gameState.prologueIdx = next;
        saveState();
        renderApp();
      }
    }

    // 초기화 실행
    loadStorage();
    updateHud();
    startTimerLoop();
    renderApp();
  </script>
</body>
</html>
